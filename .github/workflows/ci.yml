name: CI (push)

on:
  push:
    # branches:
    #   - main
    #   - '[0-9]+.[0-9]+.x'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # Shared setup job to reduce redundancy across jobs
  setup:
    runs-on: ubuntu-latest
    outputs:
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@6f54d143077baef582d70873722166fdc040066c
        with:
          cache-node-modules: true
      - name: Cache workspace
        id: cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            .angular
          key: ${{ runner.os }}-workspace-${{ hashFiles('**/pnpm-lock.yaml', '**/package.json') }}
      - name: Install node modules
        if: steps.cache.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile

  # Combined lint, validation, and devtools job for faster execution
  lint-validation-and-devtools:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@6f54d143077baef582d70873722166fdc040066c
        with:
          cache-node-modules: true
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@6f54d143077baef582d70873722166fdc040066c
      - name: Setup Bazel RBE
        uses: angular/dev-infra/github-actions/bazel/configure-remote@6f54d143077baef582d70873722166fdc040066c
        with:
          google_credential: ${{ secrets.RBE_TRUSTED_BUILDS_USER }}
      - name: Restore workspace cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            .angular
          key: ${{ runner.os }}-workspace-${{ hashFiles('**/pnpm-lock.yaml', '**/package.json') }}
      - name: Install node modules (if cache miss)
        if: needs.setup.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      - name: Check code lint
        run: yarn -s tslint
      - name: Check for circular dependencies
        run: yarn -s ts-circular-deps:check
      - name: Validate pull approve configuration
        run: yarn -s ng-dev pullapprove verify
      - name: Validate angular robot configuration
        run: yarn -s ng-dev ngbot verify
      - name: Confirm code builds with typescript as expected
        run: yarn -s check-tooling-setup
      - name: Run devtools unit tests
        run: yarn devtools:test
      - name: Test devtools build
        run: yarn devtools:build:chrome

  test:
    needs: setup
    runs-on: ubuntu-latest-4core
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@6f54d143077baef582d70873722166fdc040066c
        with:
          cache-node-modules: true
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@6f54d143077baef582d70873722166fdc040066c
      - name: Setup Bazel Remote Caching
        uses: angular/dev-infra/github-actions/bazel/configure-remote@6f54d143077baef582d70873722166fdc040066c
        with:
          google_credential: ${{ secrets.RBE_TRUSTED_BUILDS_USER }}
      - name: Restore workspace cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            .angular
          key: ${{ runner.os }}-workspace-${{ hashFiles('**/pnpm-lock.yaml', '**/package.json') }}
      - name: Install node modules (with timeout for large installs)
        if: needs.setup.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile --network-timeout 100000
      - name: Run CI tests for framework
        run: yarn test:ci

  integration-tests:
    needs: setup
    runs-on: ubuntu-latest-4core
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@6f54d143077baef582d70873722166fdc040066c
        with:
          cache-node-modules: true
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@6f54d143077baef582d70873722166fdc040066c
      - name: Setup Bazel Remote Caching
        uses: angular/dev-infra/github-actions/bazel/configure-remote@6f54d143077baef582d70873722166fdc040066c
        with:
          google_credential: ${{ secrets.RBE_TRUSTED_BUILDS_USER }}
      - name: Restore workspace cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            .angular
          key: ${{ runner.os }}-workspace-${{ hashFiles('**/pnpm-lock.yaml', '**/package.json') }}
      - name: Install node modules (with timeout for large installs)
        if: needs.setup.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile --network-timeout 100000
      - name: Run integration CI tests for framework
        run: yarn integration-tests:ci

  adev:
    needs: setup
    runs-on:
      labels: ubuntu-latest-4core
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@6f54d143077baef582d70873722166fdc040066c
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@6f54d143077baef582d70873722166fdc040066c
      - name: Setup Bazel RBE
        uses: angular/dev-infra/github-actions/bazel/configure-remote@6f54d143077baef582d70873722166fdc040066c
        with:
          google_credential: ${{ secrets.RBE_TRUSTED_BUILDS_USER }}
      - name: Restore workspace cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            .angular
          key: ${{ runner.os }}-workspace-${{ hashFiles('**/pnpm-lock.yaml', '**/package.json') }}
      - name: Install node modules (if cache miss)
        if: needs.setup.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      - name: Run tests
        run: yarn bazel test //adev/...
      - name: Build adev in fast mode to ensure it continues to work
        run: yarn bazel build //adev:build --config=release

  publish-snapshots:
    needs: setup
    runs-on:
      labels: ubuntu-latest
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@6f54d143077baef582d70873722166fdc040066c
        with:
          cache-node-modules: true
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@6f54d143077baef582d70873722166fdc040066c
      - name: Setup Bazel RBE
        uses: angular/dev-infra/github-actions/bazel/configure-remote@6f54d143077baef582d70873722166fdc040066c
        with:
          google_credential: ${{ secrets.RBE_TRUSTED_BUILDS_USER }}
      - name: Restore workspace cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            .angular
          key: ${{ runner.os }}-workspace-${{ hashFiles('**/pnpm-lock.yaml', '**/package.json') }}
      - name: Install node modules (if cache miss)
        if: needs.setup.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      - name: Configure git credentials
        run: echo "https://${{secrets.SNAPSHOT_BUILDS_GITHUB_TOKEN}}:@github.com" > ${HOME}/.git_credentials
      - name: Build packages
        run: yarn build
      - name: Publish build artifacts
        run: ./scripts/ci/publish-build-artifacts.sh

  zone-js:
    needs: setup
    runs-on:
      labels: ubuntu-latest-4core
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@6f54d143077baef582d70873722166fdc040066c
        with:
          cache-node-modules: true
          node-module-directories: |
            ./node_modules
            ./packages/zone.js/node_modules
            ./packages/zone.js/test/typings/node_modules
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@6f54d143077baef582d70873722166fdc040066c
      - name: Setup Bazel RBE
        uses: angular/dev-infra/github-actions/bazel/configure-remote@6f54d143077baef582d70873722166fdc040066c
        with:
          google_credential: ${{ secrets.RBE_TRUSTED_BUILDS_USER }}
      - name: Restore workspace cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            .angular
          key: ${{ runner.os }}-workspace-${{ hashFiles('**/pnpm-lock.yaml', '**/package.json') }}
      - name: Install node modules (if cache miss)
        if: needs.setup.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      - name: Build zone.js packages
        run: |
          yarn bazel build \
          //packages/zone.js/bundles:zone.umd.js \
          //packages/zone.js:npm_package \
          //packages/zone.js/test/closure:closure_js \

      - name: Prepare zone.js build artifacts
        run: |
          rm -Rf packages/zone.js/build
          rm -Rf packages/zone.js/test/extra/*.umd.js

          mkdir -p packages/zone.js/build/
          mkdir -p packages/zone.js/build/test/

          cp dist/bin/packages/zone.js/bundles/zone.umd.js packages/zone.js/build/zone.umd.js
          cp dist/bin/packages/zone.js/npm_package/bundles/zone-mix.umd.js ./packages/zone.js/test/extra/
          cp dist/bin/packages/zone.js/npm_package/bundles/zone-patch-electron.umd.js ./packages/zone.js/test/extra/
          cp dist/bin/packages/zone.js/test/closure/zone.closure.mjs ./packages/zone.js/build/test/zone.closure.mjs

      - name: Install zone.js dependencies and typings test dependencies
        run: |
          yarn --cwd packages/zone.js install --frozen-lockfile --non-interactive
          yarn --cwd packages/zone.js/test/typings install --frozen-lockfile --non-interactive
      - name: Run zone.js promise finally test
        run: yarn --cwd packages/zone.js promisefinallytest
      - name: Run zone.js jest tests
        run: yarn --cwd packages/zone.js jest:test
      - name: Run zone.js jest node tests
        run: yarn --cwd packages/zone.js jest:nodetest
      - name: Run zone.js vitest tests
        run: yarn --cwd packages/zone.js vitest:test
      - name: Run zone.js electron tests
        run: yarn --cwd packages/zone.js electrontest
      - name: Run zone.js typings tests
        run: yarn --cwd packages/zone.js/test/typings test

  # saucelabs:
  #   runs-on: ubuntu-latest-4core
  #   env:
  #     SAUCE_TUNNEL_IDENTIFIER: angular-framework-${{ github.run_number }}
  #   steps:
  #     - name: Initialize environment
  #       uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@b5a3609f89c06eb4037dce22a93641213a5d1508
  #       with:
  #         cache-node-modules: true
  #     - name: Install node modules
  #       run: yarn install --frozen-lockfile
  #     - uses: ./.github/actions/saucelabs-legacy

  adev-deploy:
    needs: [adev, setup]
    if: needs.adev.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Initialize environment
        uses: angular/dev-infra/github-actions/npm/checkout-and-setup-node@6f54d143077baef582d70873722166fdc040066c
      - name: Setup Bazel
        uses: angular/dev-infra/github-actions/bazel/setup@6f54d143077baef582d70873722166fdc040066c
      - name: Setup Bazel RBE
        uses: angular/dev-infra/github-actions/bazel/configure-remote@6f54d143077baef582d70873722166fdc040066c
      - name: Restore workspace cache
        uses: actions/cache@v3
        with:
          path: |
            node_modules
            .angular
          key: ${{ runner.os }}-workspace-${{ hashFiles('**/pnpm-lock.yaml', '**/package.json') }}
      - name: Install node modules (if cache miss)
        if: needs.setup.outputs.cache-hit != 'true'
        run: yarn install --frozen-lockfile
      - name: Build adev for deployment
        run: yarn bazel build //adev:build --full_build_adev --config=release
      - name: Deploy to firebase
        uses: ./.github/actions/deploy-docs-site
        with:
          serviceKey: ${{ secrets.ANGULAR_DEV_SITE_DEPLOY }}
          githubReleaseTrainReadToken: ${{ secrets.DOCS_DEPLOY_GITHUB_RELEASE_TRAIN_TOKEN }}
          configPath: 'adev/firebase.json'
          distDir: 'dist/bin/adev/dist/browser'
